<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mecânica Rápida - Clientes</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <div class="container clientes-menu-container">

    <div class="top-actions">
      <button class="btn-voltar" onclick="irDashboard()">
        <span class="material-icons">arrow_back</span>
      </button>

      <h2>Clientes</h2>
    </div>

    <header class="clientes-header">
      <img src="assets/logo.png" class="logo">
      <p>Gerencie os clientes cadastrados e os veículos atendidos pela oficina.</p>
    </header>

    <section class="clientes-opcoes">

      <div class="cliente-opcao-card">
        <span class="material-icons cliente-opcao-icon">person_add</span>

        <h3>Cadastrar Cliente</h3>
        <p>Adicione novos clientes com nome, placa, modelo do veículo e telefone.</p>

        <button onclick="irCadastroCliente()">Acessar cadastro</button>
      </div>

      <div class="cliente-opcao-card">
        <span class="material-icons cliente-opcao-icon">groups</span>

        <h3>Clientes Cadastrados</h3>
        <p>Visualize os clientes registrados no sistema e consulte os dados dos veículos.</p>

        <button onclick="irListaClientes()">Ver clientes</button>
      </div>

    </section>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
