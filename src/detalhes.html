<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mecânica Rápida - Detalhes da Ordem</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <div class="container detalhes-container">

    <div class="menu-config">
      <button onclick="toggleMenu()" class="btn-config">
        <span class="material-icons">settings</span>
      </button>

      <div id="dropdown" class="dropdown">
        <div class="dropdown-header">
          <strong>Configurações</strong>
          <span>Minha conta</span>
        </div>

        <div class="dropdown-item" onclick="irPerfil()">
          <span class="material-icons">person</span>
          <p>Perfil</p>
        </div>

        <div class="dropdown-item sair" onclick="sair()">
          <span class="material-icons">logout</span>
          <p>Sair</p>
        </div>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn-voltar" onclick="irListaOrdens()">
        <span class="material-icons">arrow_back</span>
      </button>

      <h2>Detalhes da Ordem</h2>
    </div>

    <header class="clientes-header">
      <img src="assets/logo.png" class="logo">
      <p>Informações completas da ordem de serviço.</p>
    </header>

    <section class="detalhes-card detalhes-profissional" id="areaDetalhesOrdem"></section>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
